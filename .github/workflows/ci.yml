name: GoBpmBank
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bank
          POSTGRES_PASSWORD: bank
          POSTGRES_DB: bank
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U bank -d bank" --health-interval 2s --health-retries 20
    env:
      BANK_DSN: postgres://bank:bank@localhost:5432/bank?sslmode=disable
      MOCK_DSN: postgres://bank:bank@localhost:5432/bank_core?sslmode=disable
      MOCK_TEST_DSN: postgres://bank:bank@localhost:5432/bank_core?sslmode=disable
      GO_BPM_TEST_DSN: postgres://bank:bank@localhost:5432/engine_test?sslmode=disable
      PGPASSWORD: bank
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: createdb -h localhost -U bank bank_core && createdb -h localhost -U bank engine_test
      - run: make generate && git diff --exit-code -- process internal/bpmgen
      - run: go vet ./...
      - run: go test -race -p 1 ./...
      - run: make build
      - name: Сквозные банковские сценарии
        run: |
          mkdir -p .run
          bin/mock-core-banking > .run/mock.log 2>&1 &
          bin/gobpmbank > .run/bank.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8090/healthz && curl -fsS http://127.0.0.1:8091/healthz; then break; fi
            sleep 1
          done
          make e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gobpmbank-test-results
          path: .run/
