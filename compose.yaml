name: gobpmbank
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: bank
      POSTGRES_DB: bank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте пароль в .env}
    volumes:
      - bankdata:/var/lib/postgresql
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/01-bank.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank -d bank"]
      interval: 2s
      timeout: 5s
      retries: 20
  mock-core-banking:
    build:
      context: .
      target: mock
    environment:
      MOCK_DSN: postgres://bank:${POSTGRES_PASSWORD}@postgres:5432/bank_core?sslmode=disable
    ports: ["127.0.0.1:8091:8091"]
    depends_on:
      postgres:
        condition: service_healthy
  bank:
    build:
      context: .
      target: bank
    environment:
      BANK_DSN: postgres://bank:${POSTGRES_PASSWORD}@postgres:5432/bank?sslmode=disable
      MOCK_URL: http://mock-core-banking:8091
    ports: ["127.0.0.1:8090:8090"]
    depends_on:
      postgres:
        condition: service_healthy
      mock-core-banking:
        condition: service_started
volumes:
  bankdata:
